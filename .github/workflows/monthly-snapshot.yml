name: Monthly Holdings Update

on:
  schedule:
    - cron: '30 3 10 * *'  # 10th of month, 9AM IST
  workflow_dispatch:
    inputs:
      snapshot_only:
        description: 'Only update snapshot.py (skip Supabase)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  scrape-and-seed:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event.inputs.snapshot_only }}" = "true" ]; then
            python scrape_and_seed.py --snapshot-only --output snapshot.py
          else
            python scrape_and_seed.py --output snapshot.py
          fi

      - name: Verify snapshot
        run: |
          python -c "
          from snapshot import SNAPSHOT_SCHEMES, SNAPSHOT_DATE
          n = len(SNAPSHOT_SCHEMES)
          print(f'Snapshot: {n} funds, date: {SNAPSHOT_DATE}')
          if n < 10:
              print('WARNING: Very few funds scraped')
          cats = {}
          amcs = set()
          for s in SNAPSHOT_SCHEMES.values():
              cats.setdefault(s.get('category','?'), []).append(s['name'])
              amcs.add(s.get('amc','?'))
          for cat, names in sorted(cats.items()):
              print(f'  {cat}: {len(names)}')
          print(f'AMCs: {len(amcs)}')
          print(f'Total: {n} funds')
          "

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet snapshot.py && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "MF Scraper Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MONTH=$(date +"%B %Y")
          git add snapshot.py
          git commit -m "chore: update holdings from Moneycontrol — ${MONTH}"
          git push
