name: Monthly Holdings Update

on:
  schedule:
    - cron: '30 3 10 * *'
  workflow_dispatch:
    inputs:
      snapshot_only:
        description: 'Only update snapshot.py (skip Supabase)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_funds:
        description: 'Max funds to scrape (default 300)'
        required: false
        default: '300'

permissions:
  contents: write

jobs:
  scrape-and-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run Groww scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MAX="${{ github.event.inputs.max_funds || '300' }}"
          if [ "${{ github.event.inputs.snapshot_only }}" = "true" ]; then
            python scrape_groww.py --snapshot-only --max-funds "$MAX" --output snapshot.py
          else
            python scrape_groww.py --max-funds "$MAX" --output snapshot.py
          fi

      - name: Verify snapshot
        run: |
          python -c "
          from snapshot import SNAPSHOT_SCHEMES, SNAPSHOT_DATE
          n = len(SNAPSHOT_SCHEMES)
          print(f'Snapshot: {n} funds, date: {SNAPSHOT_DATE}')
          cats = {}; amcs = set()
          for s in SNAPSHOT_SCHEMES.values():
              cats.setdefault(s.get('category','?'), []).append(s['name'])
              amcs.add(s.get('amc','?'))
          for cat, names in sorted(cats.items()):
              print(f'  {cat}: {len(names)}')
          print(f'AMCs: {len(amcs)} | Total: {n} funds')
          "

      - name: Commit if changed
        run: |
          git diff --quiet snapshot.py && echo "No changes" && exit 0
          git config user.name "MF Scraper Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MONTH=$(date +"%B %Y")
          git add snapshot.py
          git commit -m "chore: update holdings from Groww.in — ${MONTH}"
          git pull --rebase origin main
          git push
